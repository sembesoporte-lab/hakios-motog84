name: Build HakiOS for Moto G84 (bangkk)

on:
  push:
    branches: [ common ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar entorno Ubuntu con script oficial
        run: |
          chmod +x scripts/setup-ubuntu.sh
          ./scripts/setup-ubuntu.sh

      - name: Verificar estado de port para bangkk
        run: |
          python3 scripts/phone-ready.py --help || true
          ls -la

      - name: Compilar Kernel y Loader
        run: |
          make -j$(nproc)

      - name: Empaquetar release y buscar binarios
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh || true
          find . -maxdepth 3 -not -path '*/.*'

      - name: Subir artefactos compilados
        uses: actions/upload-artifact@v4
        with:
          name: hakios-bangkk-build
          path: |
            **/*.tar*
            **/*.efi
            **/*.bin
            **/*.img
            **/*kernel*
          if-no-files-found: warn
