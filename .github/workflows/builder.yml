name: Build HakiOS for Moto G84 (bangkk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm cmake ninja-build python3 git device-tree-compiler

      - name: Compilar Loader y Kernel XNU para bangkk
        run: |
          chmod +x build.sh
          # Ajusta los flags según los scripts del repo que hayas bifurcados
          ./build.sh --device bangkk

      - name: Subir artefactos compilados (boot.img / loader)
        uses: actions/upload-artifact@v4
        with:
          name: hakios-bangkk-build
          path: |
            out/*.img
            out/*.bin
