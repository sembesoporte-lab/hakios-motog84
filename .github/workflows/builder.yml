name: Build Flashable boot.img for Moto G84 (bangkk)

on:
  push:
    branches: [ common ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar entorno Ubuntu y herramientas de imagen Android
        run: |
          chmod +x scripts/setup-ubuntu.sh
          ./scripts/setup-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y mkbootimg android-sdk-libsparse-utils device-tree-compiler lz4 gzip

      - name: Compilar Kernel y Loader HakiOS
        run: |
          make -j$(nproc)
          chmod +x scripts/release.sh
          ./scripts/release.sh || true

      - name: Localizar kernel compilado y empaquetar boot.img (bangkk)
        run: |
          mkdir -p out_flash
          
          # Buscar el binario principal del kernel/loader generado por make
          KERNEL_BIN=$(find . -maxdepth 4 -type f \( -name "*kernel*" -o -name "*.efi" -o -name "*.bin" -o -name "Image*" \) ! -path "./.git/*" ! -path "./scripts/*" | head -n 1)
          
          if [ -z "$KERNEL_BIN" ]; then
            echo "ERROR: No se encontró el binario compilado."
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi
          
          echo "Empaquetando binario: $KERNEL_BIN"
          
          # Crear un ramdisk vacío válido (gzip) requerido por la estructura boot.img
          mkdir -p empty_ramdisk
          (cd empty_ramdisk && find . | cpio -o -H newc | gzip > ../ramdisk.cpio.gz)
          
          # Generar el boot.img estándar compatible con Fastboot del Moto G84 (Header v3 / 4096 pagesize)
          mkbootimg \
            --kernel "$KERNEL_BIN" \
            --ramdisk ramdisk.cpio.gz \
            --header_version 3 \
            --pagesize 4096 \
            --cmdline "console=ttyMSM0,115200n8" \
            -o out_flash/hakios-bangkk-boot.img
            
          ls -lh out_flash/hakios-bangkk-boot.img

      - name: Subir hakios-bangkk-boot.img listo para Fastboot
        uses: actions/upload-artifact@v4
        with:
          name: hakios-bangkk-boot-img
          path: out_flash/hakios-bangkk-boot.img
